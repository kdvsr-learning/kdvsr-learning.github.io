<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Class Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* For submenu transition */
    .submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-in-out;
    }

    .submenu.open {
      max-height: 1000px;
      /* A large enough value to accommodate all submenus */
    }

    .chevron-icon.open {
      transform: rotate(180deg);
    }
  </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900">
  <div id="app" class="relative min-h-screen md:flex">
    <!-- Mobile menu button -->
    <div class="bg-gray-800 text-gray-100 flex justify-between md:hidden">
      <a href="#" class="block p-4 text-white font-bold">Music Notes</a>
      <button id="mobile-menu-button" class="p-4 focus:outline-none focus:bg-gray-700" aria-label="Open sidebar">
        <!-- Menu Icon will be injected by JS -->
      </button>
    </div>

    <!-- Overlay for mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 md:hidden hidden"></div>

    <aside id="sidebar"
      class="fixed top-0 left-0 h-full bg-gray-800 text-gray-200 w-100 flex flex-col z-20 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0">
      <div class="py-7 px-2">
        <a href="#" class="text-white flex items-center space-x-2 px-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 6l12-3">
            </path>
          </svg>
          <span class="text-2xl font-extrabold">Music Notes</span>
        </a>
      </div>
      <nav id="sidebar-nav" class="overflow-y-auto flex-grow px-2">
        <ul id="menu-container">
          <!-- Menu items will be injected by JS -->
        </ul>
      </nav>

      <div class="px-2 pb-4 border-t border-gray-700 mt-auto">
        <a href="#" id="help-link"
          class="flex items-center space-x-3 p-2 mt-2 rounded-md cursor-pointer transition-colors duration-200 text-gray-300 hover:bg-gray-700 hover:text-white">
          <!-- Help icon and text will be injected by JS -->
        </a>
      </div>
    </aside>

    <main class="flex-1 p-6 md:p-10 text-gray-900 dark:text-gray-100 bg-gray-50 dark:bg-gray-800 flex flex-col">
      <h1 id="page-title" class="text-3xl font-bold mb-4"></h1>
      <iframe id="content-iframe" title="Content Area"
        class="border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 w-full flex-1" 
        onload='javascript:(function(o){o.style.height=o.contentWindow.document.body.scrollHeight+"px";}(this));' >
      </iframe>
    </main>
  </div>
  <script type="module" src="index.js"></script>
</body>

</html>
